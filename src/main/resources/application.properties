spring.application.name=ecec

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# =========================
# Logging
# =========================
logging.level.org.hibernate.SQL=DEBUG
# 바인딩 로그에 인증 코드 해시와 토큰 등 민감한 값이 남지 않도록 기본 비활성화한다.
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =========================
# JWT
# =========================
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# =========================
# Cookie
# =========================
jwt.cookie.secure=${JWT_COOKIE_SECURE}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE}

# ==========================
# LOGS
# ==========================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.security=DEBUG
