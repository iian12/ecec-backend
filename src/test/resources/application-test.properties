# 테스트는 외부 MariaDB나 실제 JWT 설정을 사용하지 않는다.
spring.datasource.url=jdbc:h2:mem:ecec-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.security=WARN
jwt.secret-key=test-only-secret-key-at-least-thirty-two-bytes-long
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
